components:
  schemas:
    CartRequest:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          default: 1
        remove:
          type: boolean
          default: false
      required:
      - product_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          oneOf:
          - type: string
            maxLength: 140
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        description:
          type: string
        icon:
          type: string
          description: Emoji or icon key, e.g. ☕
          maxLength: 40
        product_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - product_count
    FulfillmentEnum:
      enum:
      - pickup
      - delivery
      - dine_in
      type: string
      description: |-
        * `pickup` - Pickup
        * `delivery` - Delivery
        * `dine_in` - Dine in
    IntervalEnum:
      enum:
      - weekly
      - biweekly
      - monthly
      type: string
      description: |-
        * `weekly` - Weekly
        * `biweekly` - Every 2 weeks
        * `monthly` - Monthly
    KindEnum:
      enum:
      - drink
      - beans
      - food
      - merch
      type: string
      description: |-
        * `drink` - Drink
        * `beans` - Coffee Beans
        * `food` - Food
        * `merch` - Merchandise
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        status_color:
          type: string
          readOnly: true
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        fulfillment:
          $ref: '#/components/schemas/FulfillmentEnum'
        customer_name:
          type: string
          maxLength: 160
        customer_phone:
          type: string
          maxLength: 40
        delivery_address:
          type: string
          maxLength: 300
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        loyalty_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        points_used:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        points_earned:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        placed_at:
          type: string
          format: date-time
      required:
      - customer_name
      - discount
      - id
      - item_count
      - items
      - number
      - points_earned
      - status_color
      - subtotal
      - tax
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          nullable: true
        name:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        options: {}
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - name
      - unit_price
    OrderStatusEnum:
      enum:
      - pending
      - confirmed
      - preparing
      - ready
      - out_for_delivery
      - completed
      - cancelled
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `preparing` - Preparing
        * `ready` - Ready
        * `out_for_delivery` - Out for delivery
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
