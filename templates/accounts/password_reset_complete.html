{% extends "base.html" %}
{% block title %}Password updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card reveal" style="text-align:center">
    <div class="beans-reward" style="justify-content:center">
      <span class="big">✓</span>
      <span class="small">Your password has been updated</span>
    </div>
    <h1>All set — <span class="gradient-text">welcome back</span></h1>
    <p class="small mb-3">Your new password is active. Sign in and pick up where you left off.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-block">Sign in now</a>
    <p class="small mt-2"><a href="{% url 'store:home' %}" class="link-quiet">← Back to the shop</a></p>
  </div>
</div>
{% endblock %}
