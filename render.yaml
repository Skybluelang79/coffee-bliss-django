services:
  - type: web
    name: coffee-bliss
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne config.asgi:application --bind 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SITE_NAME
        value: "Coffee Bliss"
      - key: KDS_ENABLED
        value: "True"
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: "NGN"
      - key: AI_ENABLED
        value: "True"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: TWO_FACTOR_ENABLED
        value: "false"
